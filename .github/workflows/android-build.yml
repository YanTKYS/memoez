name: Android Build

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # build: デバッグ APK (全ブランチ / PR)
  # ──────────────────────────────────────────────────────────────────────────
  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # ── Node.js ─────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ── TypeScript / 静的チェック ────────────────────────────────────────
      - name: TypeScript check
        run: npx tsc --noEmit

      # ── JDK / Android SDK ───────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            tools
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;26.1.10909125

      # ── Expo prebuild (managed → bare) ──────────────────────────────────
      # android/ は .gitignore に含まれるため毎回生成する
      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      # ── android/build.gradle / gradle.properties をパッチ ───────────────
      # 生成された build.gradle は kotlinVersion を ext に定義するが
      # classpath にバージョンを指定していないため RN の BOM が 1.9.24 を
      # 解決してしまう。Compose Compiler 1.5.15 は 1.9.25 必須なので
      # classpath に $kotlinVersion を明示する。
      - name: Patch android build files for CI
        run: |
          # build.gradle: kotlin-gradle-plugin に $kotlinVersion を追加
          sed -i "s|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')|classpath(\"org.jetbrains.kotlin:kotlin-gradle-plugin:\${kotlinVersion}\")|" android/build.gradle

          # gradle.properties: メモリ設定を追記
          {
            echo ""
            echo "# CI overrides"
            echo "android.kotlinVersion=1.9.25"
            echo "kotlin.jvm.target.validation.mode=warning"
            echo "org.gradle.configuration-cache=false"
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
            echo "kotlin.daemon.jvm.options=-Xmx2g"
            echo "org.gradle.workers.max=2"
          } >> android/gradle.properties

          echo "=== patched build.gradle classpath ==="
          grep "kotlin-gradle-plugin" android/build.gradle
          echo "=== patched gradle.properties (kotlin lines) ==="
          grep -i kotlin android/gradle.properties

      # ── Gradle キャッシュ ────────────────────────────────────────────────
      # キャッシュキー: npm パッケージ + app.json で決定される生成物に依存
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # ── SHA 検証 ─────────────────────────────────────────────────────────
      - name: Verify checkout SHA
        run: |
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      # ── ビルド ───────────────────────────────────────────────────────────
      # --info の全出力はファイルに退避し、失敗時だけエラー行を表示する。
      # grep パターン: ファイルパス行 (先頭が /) を除外し、
      # Kotlin コンパイラエラー (^e: ) と Gradle エラー行のみ抽出する。
      - name: Build debug APK
        shell: bash
        run: |
          cd android
          ./gradlew assembleDebug -x checkKotlinGradlePluginConfigurationErrors --no-daemon --info > /tmp/gradle-debug.log 2>&1 || {
            echo "===== BUILD FAILED: Kotlin / compiler errors ====="
            grep -E "^e: |^w: .*error|> .*[Ee]rror|FAILED|^Caused by:|Cannot find module|unresolved reference|is not known to be compatible|BUILD FAILED" \
              /tmp/gradle-debug.log \
              | grep -v "^/" \
              | head -80
            echo "===== FAILURE block ====="
            sed -n '/FAILURE: Build failed with an exception\./,/BUILD FAILED in/p' /tmp/gradle-debug.log | head -120 || true

            echo "===== Context around first FAILED task (50 lines before) ====="
            FAIL_LINE=$(grep -n " FAILED$" /tmp/gradle-debug.log | head -1 | cut -d: -f1)
            if [ -n "$FAIL_LINE" ]; then
              START=$(( FAIL_LINE > 50 ? FAIL_LINE - 50 : 1 ))
              sed -n "${START},${FAIL_LINE}p" /tmp/gradle-debug.log
            fi

            echo "===== last 20 lines ====="
            tail -20 /tmp/gradle-debug.log
            exit 1
          }

      - name: Run Lint
        if: github.event_name == 'pull_request'
        run: cd android && ./gradlew lintDebug -x checkKotlinGradlePluginConfigurationErrors --no-daemon

      # ── アーティファクト保存 ─────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # release-apk: リリース APK (main マージ後のみ)
  # ──────────────────────────────────────────────────────────────────────────
  release-apk:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            tools
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;26.1.10909125

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Patch android build files for CI
        run: |
          sed -i "s|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')|classpath(\"org.jetbrains.kotlin:kotlin-gradle-plugin:\${kotlinVersion}\")|" android/build.gradle
          {
            echo ""
            echo "# CI overrides"
            echo "android.kotlinVersion=1.9.25"
            echo "kotlin.jvm.target.validation.mode=warning"
            echo "org.gradle.configuration-cache=false"
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
            echo "kotlin.daemon.jvm.options=-Xmx2g"
            echo "org.gradle.workers.max=2"
          } >> android/gradle.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Verify checkout SHA
        run: |
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Build release APK (unsigned)
        shell: bash
        run: |
          cd android
          ./gradlew assembleRelease -x checkKotlinGradlePluginConfigurationErrors --no-daemon --info > /tmp/gradle-release.log 2>&1 || {
            echo "===== BUILD FAILED: compiler errors ====="
            grep -E "^e: |^w: .*error|> .*[Ee]rror|FAILED|^Caused by:|Cannot find module|unresolved reference|is not known to be compatible|BUILD FAILED" \
              /tmp/gradle-release.log \
              | grep -v "^/" \
              | head -100
            echo "===== FAILURE block ====="
            sed -n '/FAILURE: Build failed with an exception\./,/BUILD FAILED in/p' /tmp/gradle-release.log | head -150 || true
            echo "===== last 20 lines ====="
            tail -20 /tmp/gradle-release.log
            exit 1
          }

      # R8/ProGuard の missing_rules があれば保存
      - name: Upload R8 missing rules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-missing-rules
          path: android/app/build/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
