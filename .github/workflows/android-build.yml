name: Android Build

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # build: デバッグ APK (全ブランチ / PR)
  # ──────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # ── Node.js ─────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── TypeScript / 静的チェック ────────────────────────────────────────
      - name: TypeScript check
        run: npx tsc --noEmit

      # ── JDK / Android SDK ───────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            tools
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;26.1.10909125

      # ── Expo prebuild (managed → bare) ──────────────────────────────────
      # android/ は .gitignore に含まれるため毎回生成する
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install

      # ── gradle.properties にメモリ設定を追記 ────────────────────────────
      # CI ランナーは RAM が限られており Kotlin daemon が OOM でサイレントに
      # クラッシュすることがある。JVM ヒープを拡大し daemon を無効化する。
      - name: Patch gradle.properties for CI
        run: |
          echo "" >> android/gradle.properties
          echo "# CI memory overrides" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          echo "kotlin.daemon.jvm.options=-Xmx2g" >> android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties

      # ── Gradle キャッシュ ────────────────────────────────────────────────
      # キャッシュキー: npm パッケージ + app.json で決定される生成物に依存
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # ── SHA 検証 ─────────────────────────────────────────────────────────
      - name: Verify checkout SHA
        run: |
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      # ── ビルド ───────────────────────────────────────────────────────────
      # --info の全出力はファイルに退避し、失敗時だけエラー行を表示する。
      # これにより CI ログが 2 万行になるのを防ぐ。
      - name: Build debug APK
        shell: bash
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --info > /tmp/gradle-debug.log 2>&1 || {
            echo "===== BUILD FAILED: Kotlin / compiler errors ====="
            grep -E "^e: |error:|ERROR|FAILED|Caused by:|Cannot find|unresolved|Exception" \
              /tmp/gradle-debug.log | head -150
            echo "===== last 30 lines ====="
            tail -30 /tmp/gradle-debug.log
            exit 1
          }

      - name: Run Lint
        run: cd android && ./gradlew lintDebug --no-daemon

      # ── アーティファクト保存 ─────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # release-apk: リリース APK (main マージ後のみ)
  # ──────────────────────────────────────────────────────────────────────────
  release-apk:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            tools
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;26.1.10909125

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Patch gradle.properties for CI
        run: |
          echo "" >> android/gradle.properties
          echo "# CI memory overrides" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          echo "kotlin.daemon.jvm.options=-Xmx2g" >> android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Verify checkout SHA
        run: |
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Build release APK (unsigned)
        shell: bash
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --info > /tmp/gradle-release.log 2>&1 || {
            echo "===== BUILD FAILED: Kotlin / compiler errors ====="
            grep -E "^e: |error:|ERROR|FAILED|Caused by:|Cannot find|unresolved|Exception" \
              /tmp/gradle-release.log | head -150
            echo "===== last 30 lines ====="
            tail -30 /tmp/gradle-release.log
            exit 1
          }

      # R8/ProGuard の missing_rules があれば保存
      - name: Upload R8 missing rules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-missing-rules
          path: android/app/build/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
