name: Android Build

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # build: デバッグ APK (全ブランチ / PR)
  # ──────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # ── Node.js ─────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── TypeScript / 静的チェック ────────────────────────────────────────
      - name: TypeScript check
        run: npx tsc --noEmit

      # ── JDK / Android SDK ───────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            tools
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # ── Expo prebuild (managed → bare) ──────────────────────────────────
      # android/ は .gitignore に含まれるため毎回生成する
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install

      # ── Gradle キャッシュ ────────────────────────────────────────────────
      # キャッシュキー: npm パッケージ + app.json で決定される生成物に依存
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # ── SHA 検証 ─────────────────────────────────────────────────────────
      - name: Verify checkout SHA
        run: |
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      # ── ビルド ───────────────────────────────────────────────────────────
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Run Lint
        run: cd android && ./gradlew lintDebug --no-daemon

      # ── アーティファクト保存 ─────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # release-apk: リリース APK (main マージ後のみ)
  # ──────────────────────────────────────────────────────────────────────────
  release-apk:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            tools
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Verify checkout SHA
        run: |
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Build release APK (unsigned)
        run: cd android && ./gradlew assembleRelease --no-daemon

      # R8/ProGuard の missing_rules があれば保存
      - name: Upload R8 missing rules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-missing-rules
          path: android/app/build/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
