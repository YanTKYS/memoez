name: Android Build

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # build: デバッグ APK (全ブランチ / PR)
  # ──────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # ── Node.js ─────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Release guard tests (no secrets)
        run: python3 -m unittest discover -s tools/tests -v

      - name: Jest
        run: npm test -- --runInBand

      # ── TypeScript / 静的チェック ────────────────────────────────────────
      - name: TypeScript check
        run: npx tsc --noEmit

      # ── JDK / Android SDK ───────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;26.1.10909125

      # ── Expo prebuild (managed → bare) ──────────────────────────────────
      # android/ は .gitignore に含まれるため毎回生成する
      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      # ── Gradle キャッシュ ────────────────────────────────────────────────
      # キャッシュキー: npm パッケージ + app.json で決定される生成物に依存
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # ── SHA 検証 ─────────────────────────────────────────────────────────
      - name: Verify checkout SHA
        run: |
          EXPECTED_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      # ── ビルド ───────────────────────────────────────────────────────────
      # --info の全出力はファイルに退避し、失敗時だけエラー行を表示する。
      # grep パターン: ファイルパス行 (先頭が /) を除外し、
      # Kotlin コンパイラエラー (^e: ) と Gradle エラー行のみ抽出する。
      - name: Build debug APK
        shell: bash
        env:
          # 任意。未設定なら Google Drive 連携は無効のビルドになる（docs/google-drive-setup.md）
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: |
          cd android
          ./gradlew assembleDebug :memoez-updates:testDebugUnitTest -x checkKotlinGradlePluginConfigurationErrors --no-configuration-cache --no-daemon --info > /tmp/gradle-debug.log 2>&1 || {
            echo "===== BUILD FAILED: Kotlin / compiler errors ====="
            grep -E "^e: |^w: .*error|> .*[Ee]rror|FAILED|^Caused by:|Cannot find module|unresolved reference|is not known to be compatible|BUILD FAILED" \
              /tmp/gradle-debug.log \
              | grep -v "^/" \
              | head -80
            echo "===== FAILURE block ====="
            sed -n '/FAILURE: Build failed with an exception\./,/BUILD FAILED in/p' /tmp/gradle-debug.log | head -120 || true

            echo "===== Context around first FAILED task (50 lines before) ====="
            FAIL_LINE=$(grep -n " FAILED$" /tmp/gradle-debug.log | head -1 | cut -d: -f1)
            if [ -n "$FAIL_LINE" ]; then
              START=$(( FAIL_LINE > 50 ? FAIL_LINE - 50 : 1 ))
              sed -n "${START},${FAIL_LINE}p" /tmp/gradle-debug.log
            fi

            echo "===== last 20 lines ====="
            tail -20 /tmp/gradle-debug.log
            exit 1
          }

      # Google Sign-In のネイティブモジュールが自動リンクで APK に入っていることを確認する
      # （config plugin は使わないため、リンクが外れても TypeScript / ビルドは通ってしまう）
      - name: Verify Google Sign-In native module is linked
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" 'classes*.dex' | grep -aq 'Lcom/reactnativegooglesignin/RNGoogleSigninModule;' \
            && echo "RNGoogleSigninModule is linked" \
            || { echo "::error::RNGoogleSigninModule not found in APK (autolinking failed)"; exit 1; }

      # ホーム画面ウィジェット（ローカル Expo モジュール modules/memoez-widget と、
      # その config plugin が生成するウィンドウ用 Activity）が prebuild 後の APK に
      # コード・マニフェストとも組み込まれていることを確認する
      - name: Verify home screen widget is packaged
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT2="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)/aapt2"
          unzip -p "$APK" 'classes*.dex' > /tmp/classes.dex
          for cls in NoteWidgetProvider NoteListWidgetProvider NoteListWidgetService host/FloatingEditorActivity host/WidgetConfigActivity; do
            grep -aq "Lexpo/modules/memoezwidget/$cls;" /tmp/classes.dex \
              || { echo "::error::expo.modules.memoezwidget.$cls not found in APK (autolinking / config plugin failed)"; exit 1; }
          done
          MANIFEST="$("$AAPT2" dump xmltree --file AndroidManifest.xml "$APK")"
          for name in NoteWidgetProvider NoteListWidgetProvider NoteListWidgetService host.FloatingEditorActivity host.WidgetConfigActivity; do
            echo "$MANIFEST" | grep -q "expo.modules.memoezwidget.$name" \
              || { echo "::error::$name is not declared in the merged AndroidManifest.xml"; exit 1; }
          done
          [ "$(echo "$MANIFEST" | grep -c 'android.appwidget.provider')" -ge 2 ] \
            || { echo "::error::appwidget provider meta-data is missing (2x2 / 4x2)"; exit 1; }
          echo "$MANIFEST" | grep -q 'android.permission.BIND_REMOTEVIEWS' \
            || { echo "::error::list widget service must be protected by BIND_REMOTEVIEWS"; exit 1; }
          echo "Home screen widget is packaged"

      - name: Run Lint
        if: github.event_name == 'pull_request'
        run: cd android && ./gradlew lintDebug -x checkKotlinGradlePluginConfigurationErrors --no-configuration-cache --no-daemon

      # ── アーティファクト保存 ─────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 14
