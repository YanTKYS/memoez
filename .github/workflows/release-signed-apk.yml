name: Release Signed APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0 or v1.0.0-beta)'
        required: true
        default: 'v0.0.0-test'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release-signed-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Node.js ─────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # ── JDK / Android SDK ───────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            tools
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;26.1.10909125

      # ── Expo prebuild (managed → bare) ──────────────────────────────────
      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      # ── android/build.gradle / gradle.properties をパッチ ───────────────
      # 生成された build.gradle は kotlinVersion を ext に定義するが
      # classpath にバージョンを指定していないため RN の BOM が 1.9.24 を
      # 解決してしまう。Compose Compiler 1.5.15 は 1.9.25 必須。
      - name: Patch android build files
        run: |
          sed -i "s|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')|classpath(\"org.jetbrains.kotlin:kotlin-gradle-plugin:\${kotlinVersion}\")|" android/build.gradle
          {
            echo ""
            echo "# CI overrides"
            echo "android.kotlinVersion=1.9.25"
            echo "kotlin.jvm.target.validation.mode=warning"
            echo "org.gradle.configuration-cache=false"
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
            echo "kotlin.daemon.jvm.options=-Xmx2g"
            echo "org.gradle.workers.max=2"
            echo "org.gradle.caching=true"
            echo "org.gradle.configuration-cache=true"
            echo "org.gradle.parallel=true"
          } >> android/gradle.properties

      # ── Gradle キャッシュ ────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # ── リリース APK ビルド ──────────────────────────────────────────────
      - name: Build release APK (unsigned)
        shell: bash
        run: |
          cd android
          ./gradlew assembleRelease -x checkKotlinGradlePluginConfigurationErrors --no-daemon --info > /tmp/gradle-release.log 2>&1 || {
            echo "===== BUILD FAILED: Kotlin / compiler errors ====="
            grep -E "^e: |^w: .*error|> .*[Ee]rror|FAILED|^Caused by:|Cannot find module|unresolved reference|is not known to be compatible|BUILD FAILED" \
              /tmp/gradle-release.log \
              | grep -v "^/" \
              | head -80
            echo "===== FAILURE block ====="
            sed -n '/FAILURE: Build failed with an exception\./,/BUILD FAILED in/p' /tmp/gradle-release.log | head -150 || true

            echo "===== Context around first FAILED task (50 lines before) ====="
            FAIL_LINE=$(grep -n " FAILED$" /tmp/gradle-release.log | head -1 | cut -d: -f1)
            if [ -n "$FAIL_LINE" ]; then
              START=$(( FAIL_LINE > 50 ? FAIL_LINE - 50 : 1 ))
              sed -n "${START},${FAIL_LINE}p" /tmp/gradle-release.log
            fi

            echo "===== last 20 lines ====="
            tail -20 /tmp/gradle-release.log
            exit 1
          }

      # ── 生成された APK を特定する ────────────────────────────────────────
      # AGP のバージョンにより unsigned / 署名済みどちらが生成されるか変わる
      - name: Locate release APK
        id: locate_apk
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          echo "=== APK directory contents ==="
          ls -lh "$APK_DIR" || echo "(directory not found)"

          # 優先順: unsigned → apk 全般
          if [ -f "$APK_DIR/app-release-unsigned.apk" ]; then
            echo "unsigned_apk=$APK_DIR/app-release-unsigned.apk" >> "$GITHUB_OUTPUT"
          elif [ -f "$APK_DIR/app-release.apk" ]; then
            echo "unsigned_apk=$APK_DIR/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find "$APK_DIR" -name "*.apk" | head -1)
            if [ -n "$FOUND" ]; then
              echo "unsigned_apk=$FOUND" >> "$GITHUB_OUTPUT"
            else
              echo "ERROR: No APK found in $APK_DIR" && exit 1
            fi
          fi
          echo "Resolved APK: $(cat $GITHUB_OUTPUT | grep unsigned_apk)"

      # ── タグからリリースチャンネルを判定 ─────────────────────────────────
      - name: Detect release channel from tag
        id: release_channel
        run: |
          TAG_NAME="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [[ "$TAG_NAME" == *"-beta"* ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
            echo "channel=beta"     >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=stable"   >> "$GITHUB_OUTPUT"
          fi

      # ── 署名シークレットの存在チェック ──────────────────────────────────
      - name: Check signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64:  ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:        ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:     ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && \
             [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -n "$ANDROID_KEY_ALIAS" ] && \
             [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets detected."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are missing. Skipping signing and release upload."
          fi

      # ── キーストアのデコード ─────────────────────────────────────────────
      - name: Decode keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release-keystore.jks

      # ── エイリアス確認 ───────────────────────────────────────────────────
      - name: Validate keystore alias
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore release-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias     "$ANDROID_KEY_ALIAS"

      # ── zipalign → apksigner で署名 ──────────────────────────────────────
      - name: Sign APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SDK_ROOT:  ${{ env.ANDROID_SDK_ROOT }}
        run: |
          UNSIGNED_APK="${{ steps.locate_apk.outputs.unsigned_apk }}"
          ALIGNED_APK="android/app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/app-release-signed.apk"
          BUILD_TOOLS_DIR="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          test -x "$ZIPALIGN"  || (echo "zipalign not found: $ZIPALIGN"  && exit 1)
          test -x "$APKSIGNER" || (echo "apksigner not found: $APKSIGNER" && exit 1)

          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks           release-keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass      "pass:$KEYSTORE_PASSWORD" \
            --key-pass     "pass:$KEY_PASSWORD" \
            --out          "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify "$SIGNED_APK"
          echo "APK signed and verified: $SIGNED_APK"

      # ── GitHub Release を作成して APK をアップロード ────────────────────
      # 署名済み APK があれば signed を、なければ unsigned を Release に添付する。
      # どちらの場合も GitHub Release は必ず作成される。
      - name: Resolve APK path for release
        id: apk
        run: |
          SIGNED="android/app/build/outputs/apk/release/app-release-signed.apk"
          if [ -f "$SIGNED" ]; then
            echo "path=$SIGNED" >> "$GITHUB_OUTPUT"
            echo "label=app-release-signed.apk" >> "$GITHUB_OUTPUT"
          else
            echo "path=${{ steps.locate_apk.outputs.unsigned_apk }}" >> "$GITHUB_OUTPUT"
            echo "label=app-release-unsigned.apk" >> "$GITHUB_OUTPUT"
            echo "⚠️ Signing secrets not configured — uploading unsigned APK."
          fi

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          prerelease: ${{ steps.release_channel.outputs.prerelease }}
          name: ${{ github.event.inputs.tag_name || github.ref_name }} (${{ steps.release_channel.outputs.channel }})
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
