name: Release Signed APK

# Deliberate owner action only. PRs, main pushes and tag pushes never publish.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Final stable tag matching app.json (vX.Y.Z)'
        required: true
        type: string
      commit:
        description: 'Full current main SHA, from an owner-merged release PR'
        required: true
        type: string

permissions: {}
concurrency:
  group: memoez-formal-release
  cancel-in-progress: false

env:
  MEMOEZ_RELEASE_CERT_SHA256: ${{ vars.MEMOEZ_RELEASE_CERT_SHA256 }}
  MEMOEZ_RELEASE_ENABLED: ${{ vars.MEMOEZ_RELEASE_ENABLED }}

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && github.actor == 'YanTKYS' && github.triggering_actor == 'YanTKYS'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'build-tools;35.0.0'
      - name: Require owner approval, protected main, increasing version, finalized notes and no collisions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: python3 tools/release.py plan --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --out release-plan.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: error
          retention-days: 1

  build:
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_NO_TYPESCRIPT_SETUP: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125'
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit && npm test -- --runInBand
      - run: python3 -m unittest discover -s tools/tests -v
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Build genuinely unsigned release (no secrets, no generated-file patches)
        working-directory: android
        run: ./gradlew :app:assembleRelease -x checkKotlinGradlePluginConfigurationErrors --no-configuration-cache --no-daemon --max-workers=2
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unsigned-release-input
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    if: github.ref == 'refs/heads/main' && github.actor == 'YanTKYS' && github.triggering_actor == 'YanTKYS'
    environment: release-signing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'build-tools;35.0.0'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-plan
          path: input/plan
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unsigned-release-input
          path: input/apk
      - name: Sign, verify certificate/package/version/non-debuggable and write checksum
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tools/release.py sign --plan input/plan/release-plan.json --apk input/apk/app-release-unsigned.apk --out dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-signed-release
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: sign
    if: github.ref == 'refs/heads/main' && github.actor == 'YanTKYS' && github.triggering_actor == 'YanTKYS'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'build-tools;35.0.0'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-plan
          path: input/plan
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-signed-release
          path: dist
      - name: Recheck approval and collisions, stage only our new draft, download and verify, publish last
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py publish --plan input/plan/release-plan.json --directory dist >> "$GITHUB_STEP_SUMMARY"
