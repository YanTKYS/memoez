name: PR Auto Merge and Delete Branch

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for conflict-free PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            if (pr.mergeable === false) {
              core.info(`Skip auto-merge: PR #${pr.number} has conflicts.`);
              return;
            }

            // GraphQL mutation to enable auto-merge (merge when required checks pass).
            const mutation = `
              mutation EnableAutoMerge($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest { number }
                }
              }
            `;

            try {
              await github.graphql(mutation, { pullRequestId: pr.node_id });
              core.info(`Enabled auto-merge for PR #${pr.number}`);
            } catch (e) {
              core.warning(`Could not enable auto-merge for PR #${pr.number}: ${e.message}`);
            }

  delete-head-branch:
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const defaultBranch = context.payload.repository.default_branch;

            if (branch === defaultBranch) {
              core.info(`Skip delete: head branch is default branch (${branch}).`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`Deleted merged branch: ${branch}`);
            } catch (e) {
              core.warning(`Could not delete branch ${branch}: ${e.message}`);
            }
